# Render Blueprint: one command-free way to reproduce the deployment.
# Secrets are declared with sync: false, so their VALUES are entered in the Render dashboard, never in Git.
services:
  - type: web
    name: hub-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /health/live
    envVars:
      - { key: NODE_VERSION, value: "24" }
      - { key: NODE_ENV, value: production }
      - { key: DB_SYNCHRONIZE, value: "false" }   # set to "true" only for the first deploy on an empty database
      - { key: AI_MODEL, value: openai/gpt-4o-mini }
      - { key: FIREBASE_PROJECT_ID, sync: false }
      - { key: FIREBASE_SERVICE_ACCOUNT_JSON, sync: false }
      - { key: FIREBASE_ROLE_ASSIGNMENTS, sync: false }
      - { key: DATABASE_URL, sync: false }
      - { key: CORS_ORIGINS, sync: false }
      - { key: AI_BASE_URL, sync: false }
      - { key: AI_API_KEY, sync: false }
  - type: web
    name: hub-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - { type: rewrite, source: /*, destination: /index.html }
    envVars:
      - { key: VITE_API_URL, sync: false }
